name: Fix renewal card payment navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-service-card-payment-text.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: renewal card payment navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch renewal card payment flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bot/routers/multi_card_payment.py')
          text = path.read_text(encoding='utf-8')

          old_text = '''def _payment_text(user: User, card: CardSettings, amount: int) -> str:
              text = card_text(user.language_code, card, amount)
              if card.bank_name:
                  text += f"\\n🏦 بانک: <b>{card.bank_name}</b>"
              return text
          '''

          new_text = '''def _payment_text(user: User, card: CardSettings, amount: int) -> str:
              # card_text() already renders the bank name. Do not append it again.
              return card_text(user.language_code, card, amount)
          '''

          if old_text not in text:
              raise SystemExit('Expected _payment_text block not found; refusing unsafe modification.')
          text = text.replace(old_text, new_text, 1)

          old_render = '''    await callback.message.edit_text(
              _payment_text(user, card, amount),
              reply_markup=_keyboard(card, amount, "custom_service:card:paid", "custom_service:back"),
          )
          '''

          new_render = '''    if subscription_data.is_extend and subscription_data.subscription_id and subscription_data.plan_id:
              back_callback = (
                  f"main_renewal:methods:{subscription_data.subscription_id}:{subscription_data.plan_id}"
              )
          else:
              back_callback = "custom_service:back"

          await callback.message.edit_text(
              _payment_text(user, card, amount),
              reply_markup=_keyboard(card, amount, "custom_service:card:paid", back_callback),
          )
          '''

          if old_render not in text:
              raise SystemExit('Expected _render_service block not found; refusing unsafe modification.')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app/bot/routers/multi_card_payment.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-service-card-payment-text.yml
          git add app/bot/routers/multi_card_payment.py .github/workflows/fix-service-card-payment-text.yml
          git diff --cached --check
          git commit -m 'fix: renewal card payment navigation'
          git push origin HEAD:main
