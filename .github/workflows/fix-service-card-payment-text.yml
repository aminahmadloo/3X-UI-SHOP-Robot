name: Fix service card payment text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-service-card-payment-text.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: format service card payment details'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch card payment text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bot/routers/wallet/handler.py')
          text = path.read_text(encoding='utf-8')

          old = '''    return (\n        f"💳 <b>پرداخت کارت به کارت</b>\\n\\n"\n        f"شماره کارت:\\n<code>{settings.card_number}</code>\\n"\n        f"🏦 بانک: <b>{settings.bank_name or 'نامشخص'}</b>\\n"\n        f"به نام:\\n<b>{settings.card_holder_name}</b>\\n"\n        f"مبلغ قابل پرداخت: <b>{amount:,} تومان</b>\\n"\n        "ابتدا مبلغ را واریز کنید، سپس روی «پرداخت کردم» بزنید و عکس رسید را ارسال کنید."\n    )'''

          new = '''    return (\n        "💳 <b>پرداخت کارت به\\nکارت</b>\\n\\n"\n        f"<b>شماره کارت:</b> <b><code>{settings.card_number}</code></b>\\n"\n        f"<b>بانک:</b> <b>{settings.bank_name or 'نامشخص'}</b>\\n"\n        f"<b>به نام:</b> <b>{settings.card_holder_name}</b>\\n\\n"\n        f"<b>مبلغ قابل پرداخت: {amount:,} تومان</b>\\n\\n"\n        "ابتدا مبلغ را واریز کنید، سپس روی «پرداخت کردم-رسید می فرستم» بزنید و عکس رسید را ارسال کنید."\n    )'''

          if old not in text:
              raise SystemExit('Expected Persian card_text block was not found; refusing unsafe modification.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app/bot/routers/wallet/handler.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-service-card-payment-text.yml
          git add app/bot/routers/wallet/handler.py .github/workflows/fix-service-card-payment-text.yml
          git commit -m 'fix: format service card payment details'
          git push origin HEAD:main
