name: Temporary custom config numbering fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/custom-config-name-numbering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-config-name-numbering
          fetch-depth: 0
      - name: Fix exact custom prefix matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/bot/services/vpn.py")
          s = p.read_text()
          old = '''        async with self.session() as session:\n            result = await session.execute(\n                select(Subscription.config_name).where(\n                    Subscription.config_name.like(f"{prefix}%")\n                )\n            )\n            for (config_name,) in result.all():\n'''
          new = '''        async with self.session() as session:\n            result = await session.execute(select(Subscription.config_name))\n            for (config_name,) in result.all():\n'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile app/bot/services/vpn.py app/bot/routers/subscription/subscription_handler.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/services/vpn.py
          git diff --cached --quiet || git commit -m "fix: match custom config prefixes exactly"
          git push origin fix/custom-config-name-numbering
