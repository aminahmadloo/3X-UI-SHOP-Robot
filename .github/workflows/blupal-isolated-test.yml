name: BluPal isolated tests

on:
  pull_request:
    paths:
      - "app/bot/payment_gateways/blupal_gateway.py"
      - "app/bot/routers/admin_tools/blupal_settings_handler.py"
      - "tests/test_blupal_gateway.py"
      - ".env.example"
      - ".github/workflows/blupal-isolated-test.yml"

jobs:
  blupal-isolated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Install test runner
        run: poetry run pip install pytest
      - name: Run isolated BluPal tests
        run: PYTHONPATH=. poetry run pytest -q tests/test_blupal_gateway.py
