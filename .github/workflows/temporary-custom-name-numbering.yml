name: Temporary custom config name numbering

on:
  push:
    branches:
      - fix/custom-config-name-numbering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vpn = Path("app/bot/services/vpn.py")
          s = vpn.read_text()
          old = '''    async def _find_clients(self, user: User) -> list[tuple[Client, Inbound]]:\n'''
          new = '''    async def generate_custom_config_name(\n        self,\n        raw_name: str,\n        volume_gb: int,\n        duration_days: int,\n        tg_id: int,\n    ) -> str:\n        """Generate a custom config name numbered per user/service/custom name.\n\n        The sequence is independent for each Telegram user, service dimensions\n        (volume + duration), and exact custom name. Existing subscriptions are\n        considered so the sequence continues monotonically.\n        """\n        prefix = f"{raw_name}-{volume_gb}GB-{duration_days}D-tg{tg_id}-"\n        max_number = 0\n\n        async with self.session() as session:\n            result = await session.execute(\n                select(Subscription.config_name).where(\n                    Subscription.config_name.like(f"{prefix}%")\n                )\n            )\n            for (config_name,) in result.all():\n                if not config_name:\n                    continue\n                name = str(config_name)\n                if not name.startswith(prefix):\n                    continue\n                suffix = name[len(prefix):]\n                if suffix.isdigit():\n                    max_number = max(max_number, int(suffix))\n\n        return f"{prefix}{max_number + 1}"\n\n    async def _find_clients(self, user: User) -> list[tuple[Client, Inbound]]:\n'''
          if old not in s:
              raise SystemExit("vpn.py anchor not found")
          s = s.replace(old, new, 1)
          vpn.write_text(s)

          handler = Path("app/bot/routers/subscription/subscription_handler.py")
          s = handler.read_text()
          old = 'async def message_config_name(\n    message: Message,\n    user: User,\n    state: FSMContext,\n    gateway_factory: GatewayFactory,\n) -> None:'
          new = 'async def message_config_name(\n    message: Message,\n    user: User,\n    session: AsyncSession,\n    state: FSMContext,\n    services: ServicesContainer,\n    gateway_factory: GatewayFactory,\n) -> None:'
          if old not in s:
              raise SystemExit("handler signature anchor not found")
          s = s.replace(old, new, 1)

          old = '''    callback_data.config_name = (\n        f"{raw_name}-"\n        f"{callback_data.volume_gb}GB-"\n        f"{callback_data.duration}D-"\n        f"tg{user.tg_id}-"\n        f"1"\n    )\n'''
          new = '''    callback_data.config_name = await services.vpn.generate_custom_config_name(\n        raw_name=raw_name,\n        volume_gb=callback_data.volume_gb,\n        duration_days=callback_data.duration,\n        tg_id=user.tg_id,\n    )\n'''
          if old not in s:
              raise SystemExit("handler config-name block not found")
          s = s.replace(old, new, 1)
          handler.write_text(s)
          PY

      - name: Validate Python
        run: |
          python -m py_compile app/bot/services/vpn.py app/bot/routers/subscription/subscription_handler.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/services/vpn.py app/bot/routers/subscription/subscription_handler.py
          git commit -m "fix: number custom config names per service" || exit 0
          git push
