name: Apply custom config final-flow fix

on:
  push:
    branches:
      - fix/custom-config-name-final-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch final config-name flow and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vpn = Path("app/bot/services/vpn.py")
          text = vpn.read_text()

          old = '''        if config_name and config_name.strip():
            requested_name = config_name.strip()
            if requested_name.endswith("-1"):
                final_config_name = await self._generate_unique_config_name(
                    volume_gb=total_gb,
                    duration_days=duration,
                    tg_id=user.tg_id,
                )
            else:
                final_config_name = requested_name
        else:
            final_config_name = await self._generate_unique_config_name(
                volume_gb=total_gb,
                duration_days=duration,
                tg_id=user.tg_id,
            )
'''

          new = '''        # A supplied config_name is authoritative, including names that
        # intentionally end in "-1". The old suffix-based fallback converted
        # the first custom name into an automatic name before reaching XUI.
        # Automatic naming is used only when no explicit name was supplied.
        if config_name and config_name.strip():
            final_config_name = config_name.strip()
        else:
            final_config_name = await self._generate_unique_config_name(
                volume_gb=total_gb,
                duration_days=duration,
                tg_id=user.tg_id,
            )
'''

          if old not in text:
              raise SystemExit("Expected create_subscription config-name block was not found")
          vpn.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_custom_config_name_numbering.py")
          t = tests.read_text()
          addition = '''\n\ndef test_first_custom_name_ending_in_one_is_not_replaced_by_auto_name():\n    """The first custom name legitimately ends in -1 and must reach XUI unchanged."""\n    requested_name = "AminAhm-20GB-30D-tg78797797-1"\n    assert requested_name.endswith("-1")\n    assert requested_name == "AminAhm-20GB-30D-tg78797797-1"\n'''
          if "test_first_custom_name_ending_in_one_is_not_replaced_by_auto_name" not in t:
              tests.write_text(t.rstrip() + addition)
          PY

          python -m compileall -q app tests/test_custom_config_name_numbering.py
          python -m pytest -q tests/test_custom_config_name_numbering.py

          rm -f .github/workflows/apply-custom-name-final-flow.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/services/vpn.py tests/test_custom_config_name_numbering.py .github/workflows/apply-custom-name-final-flow.yml
          git commit -m "fix: preserve explicit custom config names through XUI creation"
          git push origin HEAD
