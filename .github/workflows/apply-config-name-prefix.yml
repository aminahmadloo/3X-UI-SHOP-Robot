name: Apply custom config name prefix

on:
  push:
    branches:
      - fix/custom-config-name-prefix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-config-name-prefix
          fetch-depth: 0

      - name: Update custom config name format
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/bot/routers/subscription/subscription_handler.py")
          text = path.read_text(encoding="utf-8")

          old = '''    callback_data.config_name = (\n        f"{callback_data.volume_gb}GB-"\n        f"{callback_data.duration}D-"\n        f"tg{user.tg_id}-"\n        f"1-"\n        f"{raw_name}"\n    )'''

          new = '''    callback_data.config_name = (\n        f"{raw_name}-"\n        f"{callback_data.volume_gb}GB-"\n        f"{callback_data.duration}D-"\n        f"tg{user.tg_id}-"\n        f"1"\n    )'''

          if old not in text:
              raise SystemExit("Expected custom config-name block was not found; refusing to modify the file.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate source syntax
        run: python -m py_compile app/bot/routers/subscription/subscription_handler.py

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-config-name-prefix.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/subscription/subscription_handler.py .github/workflows/apply-config-name-prefix.yml
          git commit -m "fix: prefix custom config names" || exit 0
          git push origin HEAD:fix/custom-config-name-prefix
