name: AI migration isolated verification

on:
  push:
    branches:
      - verify-ai-migration-20260920

jobs:
  migration:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "000000:TEST"
      BOT_DEV_ID: "78797797"
      BOT_ADMINS: "78797797,92193282"
      BOT_SUPPORT_ID: "78797797"
      BOT_DOMAIN: "https://example.test"
      XUI_USERNAME: "test"
      XUI_PASSWORD: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Upgrade all migrations
        run: poetry run alembic -c app/db/alembic.ini upgrade head
      - name: Verify production_controls column
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("app/data/bot_database.db")
          columns = {row[1] for row in conn.execute("PRAGMA table_info(ai_content_settings)")}
          assert "production_controls" in columns, columns
          print("production_controls column verified")
          PY
      - name: Downgrade through new migration
        run: poetry run alembic -c app/db/alembic.ini downgrade 20260911_advertising_publication_targets
      - name: Re-upgrade new migration
        run: poetry run alembic -c app/db/alembic.ini upgrade head
