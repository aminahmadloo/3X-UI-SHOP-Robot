name: Temporary custom config name numbering fix

on:
  push:
    branches:
      - fix/custom-config-name-numbering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix prefix matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/bot/services/vpn.py")
          s = p.read_text()
          old = '''        async with self.session() as session:\n            result = await session.execute(\n                select(Subscription.config_name).where(\n                    Subscription.config_name.like(f"{prefix}%")\n                )\n            )\n            for (config_name,) in result.all():\n'''
          new = '''        async with self.session() as session:\n            result = await session.execute(select(Subscription.config_name))\n            for (config_name,) in result.all():\n'''
          if old not in s:
              raise SystemExit("custom-name LIKE block not found")
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile app/bot/services/vpn.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/services/vpn.py
          git commit -m "fix: match custom config prefixes exactly" || exit 0
          git push
