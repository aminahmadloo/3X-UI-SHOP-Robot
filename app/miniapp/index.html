<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ToonelVPN</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#f4f7fb);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#101828);--hint:var(--tg-theme-hint-color,#667085);--accent:var(--tg-theme-button-color,#1677c8);--accent2:#0b4f83;--border:rgba(16,24,40,.09);--green:#18a558;--orange:#d98200;--red:#d92d20;--purple:#7b61ff;--shadow:0 10px 30px rgba(16,24,40,.07);--glass:rgba(255,255,255,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px 14px calc(90px + var(--tg-content-safe-area-inset-bottom,0px));min-height:100vh}.app{max-width:780px;margin:auto}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 15px}.identity{display:flex;gap:11px;align-items:center}.avatar{width:52px;height:52px;border-radius:17px;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;box-shadow:var(--shadow)}.name{font-size:19px;font-weight:900}.muted{font-size:12px;color:var(--hint);margin-top:3px}.icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:13px;padding:10px 12px;font-size:16px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09);left:-50px;top:-55px}.hero-label{font-size:12px;opacity:.8}.hero-status{font-size:23px;font-weight:950;margin:5px 0 3px}.hero-meta{font-size:12px;opacity:.9}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:10px;position:relative;z-index:1}.balance{font-size:14px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--hint)}.section{display:flex;justify-content:space-between;align-items:end;margin:20px 3px 9px}.section h2{font-size:17px;margin:0;font-weight:900}.section small{color:var(--hint);font-size:11px}.service{background:var(--card);border:1px solid var(--border);border-radius:19px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}.service-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.service-name{font-weight:900;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850;white-space:nowrap}.active{background:rgba(24,165,88,.12);color:var(--green)}.expired{background:rgba(217,45,32,.12);color:var(--red)}.inactive{background:rgba(102,112,133,.12);color:var(--hint)}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.fact{background:rgba(127,127,127,.06);border-radius:12px;padding:9px}.fact label{display:block;color:var(--hint);font-size:10px;margin-bottom:3px}.fact b{font-size:12px}.progress{height:8px;background:rgba(127,127,127,.12);border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s}.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}.btn{border:0;border-radius:13px;padding:11px 8px;font-weight:800;font-size:12px;background:var(--accent);color:#fff}.btn.alt{background:rgba(127,127,127,.09);color:var(--text)}.btn.green{background:var(--green);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.wide{width:100%;margin-top:8px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick .tile{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:14px;text-align:right;box-shadow:var(--shadow);font-weight:850}.tile small{display:block;color:var(--hint);font-size:10px;font-weight:500;margin-top:4px}.server-list{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--border);padding:8px 10px;border-radius:999px;font-size:11px}.activity{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}.activity:last-child{border:0}.empty,.error,.loading{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;text-align:center;color:var(--hint);box-shadow:var(--shadow)}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.menu-item{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:15px;text-align:right;box-shadow:var(--shadow)}.menu-item b{font-size:14px}.menu-item small{display:block;color:var(--hint);margin-top:4px;font-size:10px}.wallet-balance{text-align:center;padding:23px;border-radius:22px;background:linear-gradient(135deg,#173d65,var(--accent2));color:#fff;box-shadow:var(--shadow)}.wallet-balance span{display:block;font-size:11px;opacity:.75}.wallet-balance strong{font-size:30px;display:block;margin-top:4px}.money{font-weight:900}.plus{color:var(--green)}.minus{color:var(--red)}.level{display:flex;justify-content:space-between;align-items:center;gap:10px}.level-icon{font-size:28px}.sharebox{background:rgba(123,97,255,.08);border:1px solid rgba(123,97,255,.16);border-radius:18px;padding:15px}.share-link{direction:ltr;text-align:left;word-break:break-all;font-size:11px;background:var(--card);padding:10px;border-radius:12px;margin:9px 0}.ticket{border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:9px;background:var(--card)}.ticket-status{font-size:10px;color:var(--hint)}.message{margin-top:9px;padding:9px 11px;border-radius:12px;background:rgba(127,127,127,.07);font-size:12px}.admin-banner{background:linear-gradient(135deg,#2f1b67,#6b46c1);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}.admin-stat b{font-size:20px}.qr{text-align:center;padding:10px;background:#fff;border-radius:18px;margin:10px auto;width:max-content}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:end}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-height:91vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet-head h2{margin:0;font-size:18px}.close{border:0;background:var(--card);color:var(--text);border-radius:11px;padding:9px}.url{word-break:break-all;background:var(--card);border:1px solid var(--border);padding:11px;border-radius:12px;font-size:10px;direction:ltr;text-align:left;margin:9px 0}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(15px);border-top:1px solid var(--border);padding:8px 12px calc(8px + var(--tg-content-safe-area-inset-bottom,0px))}.nav{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{border:0;background:transparent;color:var(--hint);padding:7px 3px;border-radius:12px;font-size:10px}.nav button.on{background:rgba(22,119,200,.11);color:var(--accent);font-weight:900}.toast{position:fixed;z-index:50;bottom:105px;left:50%;transform:translateX(-50%) translateY(15px);background:#101828;color:#fff;border-radius:13px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.spinner{width:25px;height:25px;border:3px solid rgba(127,127,127,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.facts{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}.menu-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app"><div id="root" class="loading"><div class="spinner"></div>در حال راه‌اندازی ToonelVPN…</div></div>
<div class="bottom"><div class="nav">
<button data-tab="home">🏠<br>خانه</button><button data-tab="services">🔐<br>سرویس‌ها</button><button data-tab="wallet">💰<br>کیف پول</button><button data-tab="referral">🎁<br>دعوت</button><button data-tab="more">☰<br>بیشتر</button>
</div></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">ToonelVPN</h2><button class="close" onclick="closeModal()">✕</button></div><div id="detail"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.enableClosingConfirmation?.()}
const root=document.getElementById('root'),modal=document.getElementById('modal'),detail=document.getElementById('detail'),modalTitle=document.getElementById('modalTitle'),toastEl=document.getElementById('toast');
let state={data:null,tab:'home',plans:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n);if(n<0)return'نامحدود';if(n>=1073741824)return(n/1073741824).toFixed(1)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return Math.round(n)+' B'};
const money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
const date=v=>v?new Date(v).toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'}):'—';
const time=v=>v?new Date(v).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const status=s=>s==='active'?['فعال','active']:s==='expired'?['منقضی','expired']:['غیرفعال','inactive'];
function haptic(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch{}}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2300)}
function openBot(){haptic();tg?.openTelegramLink?.('https://t.me/ToonelVpn_bot')||window.open('https://t.me/ToonelVpn_bot','_blank')}
function closeModal(){modal.classList.remove('open');detail.innerHTML=''}
function setTab(t){haptic();state.tab=t;render()}
function api(path){return fetch(path,{headers:{'X-Telegram-Init-Data':tg?.initData||''},cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error(await r.text()||'خطا در دریافت اطلاعات');return r.json()})}
async function load(){try{if(!tg?.initData)throw new Error('این Mini App باید از داخل تلگرام باز شود.');root.innerHTML='<div class="loading"><div class="spinner"></div>دریافت اطلاعات زنده از 3X-UI…</div>';state.data=await api('/miniapp/api/me');render()}catch(e){root.innerHTML='<div class="error">❌ '+esc(e.message)+'<br><br><button class="btn" onclick="load()">تلاش دوباره</button></div>'}}
function header(){const u=state.data.user,t=state.data.telegram,photo=t?.photo_url?`<img class="avatar" src="${esc(t.photo_url)}">`:`<div class="avatar">${esc((u.first_name||'ت')[0])}</div>`;return `<div class="top"><div class="identity">${photo}<div><div class="name">سلام ${esc(u.first_name)} 👋</div><div class="muted">حساب ToonelVPN • ${u.username?'@'+esc(u.username):'Telegram'}</div></div></div><button class="icon-btn" onclick="load()">↻</button></div>`}
function serviceCard(s){const[st,cl]=status(s.status),total=Number(s.traffic_total||0),used=Number(s.traffic_used||0),pct=total>0?Math.min(100,Math.round(used/total*100)):0;return `<div class="service"><div class="service-head"><div class="service-name">${esc(s.name||'سرویس ToonelVPN')}</div><span class="badge ${cl}">${st}</span></div><div class="facts"><div class="fact"><label>مصرف</label><b>${bytes(used)}</b></div><div class="fact"><label>باقی‌مانده</label><b>${bytes(s.traffic_remaining)}</b></div><div class="fact"><label>انقضا</label><b>${date(s.expire_date)}</b></div><div class="fact"><label>دستگاه</label><b>${s.devices<0?'نامحدود':s.devices}</b></div></div>${total>0?`<div class="progress"><i style="width:${pct}%"></i></div><div class="muted">${pct}% مصرف شده</div>`:''}<div class="muted" style="margin:9px 0">🖥️ ${esc(s.server?.name||'سرور نامشخص')}${s.server?.location?' • '+esc(s.server.location):''}</div><div class="actions"><button class="btn" onclick="openDetail(${s.id})">جزئیات و اتصال</button><button class="btn alt" onclick="copySubscription(${s.id})">Subscription</button><button class="btn alt" onclick="renew(${s.id})">تمدید</button></div></div>`}
function home(){const d=state.data.dashboard,a=state.data.account,s=state.data.services[0];return `${header()}<div class="hero"><div class="hero-row"><div><div class="hero-label">وضعیت کلی حساب</div><div class="hero-status">${d.active_services?'🟢 سرویس فعال':'⚪ بدون سرویس فعال'}</div><div class="hero-meta">${d.active_services} فعال • ${d.total_services} سرویس زنده از 3X-UI</div></div><div class="balance">💰 ${money(a.wallet_balance)}</div></div></div><div class="grid"><div class="stat"><b>${d.active_services}</b><span>سرویس فعال</span></div><div class="stat"><b>${bytes(d.traffic_used)}</b><span>مصرف‌شده</span></div><div class="stat"><b>${bytes(d.traffic_remaining)}</b><span>باقی‌مانده</span></div><div class="stat"><b>${s?date(s.expire_date):'—'}</b><span>نزدیک‌ترین انقضا</span></div></div><div class="section"><h2>میانبرهای سریع</h2></div><div class="quick"><button class="tile" onclick="setTab('services')">🔐 سرویس‌های من<small>مدیریت و اتصال</small></button><button class="tile" onclick="showPlans()">🛒 خرید سرویس<small>پلن‌ها و مدت‌ها</small></button><button class="tile" onclick="setTab('wallet')">💰 کیف پول<small>${money(a.wallet_balance)}</small></button><button class="tile" onclick="setTab('referral')">🎁 دعوت دوستان<small>${a.referrals} دعوت</small></button></div>${s?`<div class="section"><h2>سرویس اصلی</h2><small>اطلاعات زنده</small></div>${serviceCard(s)}`:''}<div class="section"><h2>فعالیت اخیر</h2></div>${activityBox(state.data.dashboard.recent_activity)}</div>`}
function servicesTab(){return `${header()}<div class="section"><h2>سرویس‌های من</h2><small>${state.data.services.length} سرویس زنده</small></div>${state.data.services.length?state.data.services.map(serviceCard).join(''):'<div class="empty">🔐<br><br>سرویسی برای این حساب در 3X-UI پیدا نشد.<br><br><button class="btn" onclick="showPlans()">🛒 خرید اولین سرویس</button></div>'}<div class="card" style="margin-top:12px"><b>💡 مدیریت سرویس</b><div class="muted">برای حفظ هماهنگی کامل با منطق ربات، خرید و تمدید نهایی از همان جریان اصلی ربات انجام می‌شود.</div><button class="btn alt wide" onclick="showPlans()">مشاهده پلن‌ها و خرید</button></div>`}
function walletTab(){const a=state.data.account,tx=state.data.wallet_transactions||[];return `${header()}<div class="wallet-balance"><span>موجودی کیف پول</span><strong>${money(a.wallet_balance)}</strong><button class="btn" style="margin-top:12px;background:#fff;color:#173d65" onclick="openBot()">➕ افزایش موجودی</button></div><div class="section"><h2>سطح مشتری</h2></div><div class="card level"><div><b>${esc(a.level)}</b><div class="muted">⭐ ${a.points} امتیاز • 🎯 ${a.discount_percent}% تخفیف</div></div><div class="level-icon">${a.level_key==='gold'?'🥇':a.level_key==='silver'?'🥈':a.level_key==='bronze'?'🥉':'🏷️'}</div></div><div class="section"><h2>تراکنش‌های کیف پول</h2><small>${tx.length} مورد اخیر</small></div><div class="card">${tx.map(x=>`<div class="activity"><span>${x.amount>=0?'🟢':'🔴'}</span><div style="flex:1"><b>${esc(x.description||x.type)}</b><div class="muted">${time(x.created_at)}</div></div><span class="money ${x.amount>=0?'plus':'minus'}">${x.amount>=0?'+':''}${Number(x.amount).toLocaleString('fa-IR')}</span></div>`).join('')||'<div class="muted">تراکنشی ثبت نشده است.</div>'}</div>`}
function referralTab(){const r=state.data.referral,a=state.data.account;return `${header()}<div class="sharebox"><div class="level"><div><b>🎁 معرفی دوستان</b><div class="muted">با دعوت دوستان امتیاز و پاداش بگیر.</div></div><div style="font-size:28px">🚀</div></div><div class="share-link">${esc(r.link)}</div><div class="grid"><div class="stat"><b>${r.referrals}</b><span>افراد دعوت‌شده</span></div><div class="stat"><b>${r.purchase_count}</b><span>خرید موفق</span></div><div class="stat"><b>${money(r.rewards_total)}</b><span>پاداش ثبت‌شده</span></div><div class="stat"><b>${a.points}</b><span>امتیاز مشتری</span></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="copyText('${esc(r.link)}','لینک دعوت کپی شد')">📋 کپی لینک</button><button class="btn alt" onclick="shareReferral()">📤 اشتراک‌گذاری</button><button class="btn alt" onclick="showReferralRules()">ℹ️ جزئیات</button></div></div><div class="section"><h2>سطح و تخفیف</h2></div><div class="card"><b>${esc(a.level)}</b><div class="muted">با جمع شدن امتیازها، سطح شما افزایش پیدا می‌کند و تخفیف خرید بیشتر می‌شود.</div><div class="progress" style="margin-top:12px"><i style="width:${Math.min(100,(a.points%5)*20||5)}%"></i></div></div>`}
function moreTab(){const a=state.data.account;return `${header()}${state.data.admin?`<div class="admin-banner"><b>🛡️ پنل مدیریت</b><div style="font-size:11px;opacity:.8;margin-top:4px">دسترسی ادمین فعال است؛ بخش مدیریت فقط برای admin_ids قابل مشاهده است.</div><button class="btn" style="margin-top:10px;background:#fff;color:#4b2c8f" onclick="showAdmin()">ورود به داشبورد مدیریت</button></div>`:''}<div class="section"><h2>حساب و امکانات</h2></div><div class="menu-grid"><button class="menu-item" onclick="showProfile()">👤<br><b>پروفایل</b><small>اطلاعات حساب</small></button><button class="menu-item" onclick="showTransactions()">💳<br><b>تاریخچه پرداخت</b><small>تراکنش‌ها</small></button><button class="menu-item" onclick="showDashboard()">📊<br><b>داشبورد</b><small>آمار کامل</small></button><button class="menu-item" onclick="showSupport()">🎧<br><b>پشتیبانی</b><small>${a.support_open?'تیکت باز دارید':'ارتباط با پشتیبانی'}</small></button><button class="menu-item" onclick="showGuide()">📖<br><b>راهنمای اتصال</b><small>Android / iOS / Windows</small></button><button class="menu-item" onclick="showPlans()">🛒<br><b>خرید سرویس</b><small>پلن و مدت</small></button></div><div class="section"><h2>امنیت و حریم خصوصی</h2></div><div class="card"><b>🔐 احراز هویت Telegram</b><div class="muted">این Mini App فقط با Telegram init data معتبر کار می‌کند و داده‌ها بر اساس حساب احراز‌شده محدود می‌شوند.</div><div class="muted" style="margin-top:8px">🛡️ سرویس‌ها از داده زنده 3X-UI خوانده می‌شوند.</div></div>`}
function dashboardView(){const d=state.data.dashboard;return `<div class="section"><h2>📊 داشبورد کامل</h2><small>داده زنده</small></div><div class="grid"><div class="stat"><b>${d.active_services}</b><span>فعال</span></div><div class="stat"><b>${d.expired_services}</b><span>منقضی</span></div><div class="stat"><b>${d.total_services}</b><span>سرویس زنده</span></div><div class="stat"><b>${date(d.nearest_expiry)}</b><span>نزدیک‌ترین انقضا</span></div></div><div class="section"><h2>سرورهای استفاده‌شده</h2></div><div class="server-list">${d.servers.map(x=>`<span class="chip">🖥️ ${esc(x.name)}${x.location?' • '+esc(x.location):''}${x.online?' • 🟢':''}</span>`).join('')||'<span class="muted">—</span>'}</div><div class="section"><h2>فعالیت‌های اخیر</h2></div>${activityBox(d.recent_activity)}`}
function activityBox(items){return `<div class="card">${items?.map(x=>`<div class="activity"><span>${x.icon||'•'}</span><div><b>${esc(x.title)}</b><div class="muted">${time(x.date)} • ${esc(x.status||'')}</div></div></div>`).join('')||'<div class="muted">فعالیتی ثبت نشده است.</div>'}</div>`}
function render(){let body=state.tab==='home'?home():state.tab==='services'?servicesTab():state.tab==='wallet'?walletTab():state.tab==='referral'?referralTab():moreTab();root.innerHTML=body;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab))}
async function openDetail(id){try{modalTitle.textContent='جزئیات سرویس';detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال دریافت اطلاعات زنده…</div>';modal.classList.add('open');const s=await api('/miniapp/api/services/'+id);const[st,cl]=status(s.status);detail.innerHTML=`<span class="badge ${cl}">${st}</span><h2 style="margin:8px 0">${esc(s.name)}</h2><div class="facts"><div class="fact"><label>کل حجم</label><b>${bytes(s.traffic_total)}</b></div><div class="fact"><label>مصرف</label><b>${bytes(s.traffic_used)}</b></div><div class="fact"><label>باقی‌مانده</label><b>${bytes(s.traffic_remaining)}</b></div><div class="fact"><label>دستگاه</label><b>${s.devices<0?'نامحدود':s.devices}</b></div><div class="fact"><label>انقضا</label><b>${date(s.expire_date)}</b></div><div class="fact"><label>سرور</label><b>${esc(s.server?.name||'—')}</b></div><div class="fact"><label>Inbound</label><b>${esc(s.inbound_id||'—')}</b></div><div class="fact"><label>Flow</label><b>${esc(s.flow||'—')}</b></div></div><div class="card"><b>📡 وضعیت اتصال</b><div class="muted">${s.online===true?'🟢 آنلاین':s.online===false?'🔴 آفلاین':'⚪ وضعیت لحظه‌ای کلاینت در XUI در دسترس نیست'}</div></div><button class="btn wide" onclick="copySubscription(${s.id})">📋 کپی Subscription</button><button class="btn alt wide" onclick="showQR(${s.id})">▣ نمایش QR اتصال</button><button class="btn alt wide" onclick="showGuide()">📖 راهنمای اتصال</button><button class="btn green wide" onclick="renew(${s.id})">🔄 تمدید سرویس</button>${s.subscription_url?`<div class="section"><h2>Subscription URL</h2></div><div class="url">${esc(s.subscription_url)}</div>`:''}` }catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
async function getService(id){return api('/miniapp/api/services/'+id)}
async function copySubscription(id){try{const s=await getService(id);if(!s.subscription_url){toast('Subscription برای این سرویس موجود نیست');return}copyText(s.subscription_url,'Subscription کپی شد')}catch(e){toast('خطا در دریافت Subscription')}}
async function copyText(text,msg='کپی شد'){try{await navigator.clipboard.writeText(text);haptic();toast(msg)}catch{toast('امکان کپی خودکار وجود ندارد')}}
function renew(id){haptic();openBot()}
async function showPlans(){modalTitle.textContent='پلن‌های ToonelVPN';modal.classList.add('open');detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال دریافت پلن‌های فعال…</div>';try{state.plans=await api('/miniapp/api/plans');const plans=state.plans.plans||[];const durations=state.plans.durations||[];detail.innerHTML=`<div class="card"><b>🛒 خرید سرویس</b><div class="muted">قیمت‌ها و مدت‌ها از همان PlanService اصلی ربات خوانده می‌شوند.</div></div><div class="section"><h2>پلن‌ها</h2></div>${plans.map(p=>`<div class="card" style="margin-bottom:9px"><b>📱 ${p.devices<0?'نامحدود':p.devices+' دستگاه'}</b><div class="facts">${Object.entries(p.prices||{}).flatMap(([currency,values])=>Object.entries(values).map(([days,price])=>`<div class="fact"><label>${esc(currency)} • ${days} روز</label><b>${Number(price).toLocaleString('fa-IR')}</b></div>`)).join('')}</div><button class="btn wide" onclick="openBot()">ادامه خرید در ربات</button></div>`).join('')||'<div class="empty">پلنی پیدا نشد.</div>'}<div class="section"><h2>مدت‌های موجود</h2></div><div class="server-list">${durations.map(d=>`<span class="chip">⏱️ ${d} روز</span>`).join('')||'—'}</div>`}catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
function showProfile(){modalTitle.textContent='پروفایل من';modal.classList.add('open');const u=state.data.user,t=state.data.telegram,a=state.data.account;detail.innerHTML=`<div class="card" style="text-align:center"><div class="avatar" style="margin:auto">${esc((u.first_name||'ت')[0])}</div><h2>${esc(u.first_name)}</h2><div class="muted">${u.username?'@'+esc(u.username):'بدون username'}</div></div><div class="facts"><div class="fact"><label>Telegram ID</label><b>${u.id}</b></div><div class="fact"><label>تاریخ عضویت</label><b>${date(u.created_at)}</b></div><div class="fact"><label>سطح</label><b>${esc(a.level)}</b></div><div class="fact"><label>امتیاز</label><b>${a.points}</b></div><div class="fact"><label>تخفیف</label><b>${a.discount_percent}%</b></div><div class="fact"><label>دعوت‌ها</label><b>${a.referrals}</b></div></div><div class="card"><b>🧪 وضعیت تست</b><div class="muted">${u.is_trial_used?'تست قبلی استفاده شده است.':'تست استفاده نشده است.'}</div></div>`}
async function showTransactions(){modalTitle.textContent='تاریخچه پرداخت';modal.classList.add('open');detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال دریافت…</div>';try{const x=await api('/miniapp/api/transactions?limit=50');detail.innerHTML='<div class="card">'+(x.transactions||[]).map(t=>`<div class="activity"><span>💳</span><div style="flex:1"><b>${esc(t.payment_id)}</b><div class="muted">${time(t.created_at)}</div></div><span class="badge ${t.status==='completed'?'active':'inactive'}">${esc(t.status)}</span></div>`).join('')||'<div class="muted">تراکنشی ثبت نشده است.</div>'+'</div>'}catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
async function showSupport(){modalTitle.textContent='پشتیبانی';modal.classList.add('open');detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال دریافت تیکت‌ها…</div>';try{const x=await api('/miniapp/api/support');detail.innerHTML=`<div class="card"><b>🎧 پشتیبانی ToonelVPN</b><div class="muted">برای حفظ همان منطق پشتیبانی ربات، ایجاد و ارسال پیام جدید از مسیر اصلی ربات انجام می‌شود.</div><button class="btn wide" onclick="openBot()">💬 ورود به پشتیبانی</button></div><div class="section"><h2>تیکت‌های قبلی</h2></div>${(x.tickets||[]).map(t=>`<div class="ticket"><b>تیکت #${t.id}</b><div class="ticket-status">${esc(t.status)} • ${time(t.updated_at)}</div>${(t.messages||[]).slice(-3).map(m=>`<div class="message"><b>${m.sender_type==='support'?'پشتیبانی':'شما'}:</b> ${esc(m.text)}</div>`).join('')}</div>`).join('')||'<div class="empty">هنوز تیکتی ثبت نشده است.</div>'}`}catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
function showGuide(){modalTitle.textContent='راهنمای اتصال';modal.classList.add('open');detail.innerHTML=`<div class="menu-grid"><div class="menu-item">🤖<br><b>Android</b><small>Subscription را کپی کن، داخل کلاینت سازگار Import کن و Update Subscription بزن.</small></div><div class="menu-item">🍎<br><b>iPhone / iPad</b><small>لینک Subscription را Copy و داخل کلاینت سازگار اضافه کن.</small></div><div class="menu-item">💻<br><b>Windows</b><small>Subscription را در کلاینت انتخابی وارد و Update کن.</small></div><div class="menu-item">🍎<br><b>macOS</b><small>لینک اشتراک را به کلاینت سازگار اضافه کن.</small></div><div class="menu-item">🐧<br><b>Linux</b><small>Subscription را در کلاینت سازگار وارد کن.</small></div><div class="menu-item">🔄<br><b>بروزرسانی</b><small>بعد از تغییر سرویس، Subscription را Update کن.</small></div></div><div class="card" style="margin-top:10px"><b>⚠️ نکته</b><div class="muted">کلید/Subscription فقط پس از احراز هویت Telegram و برای سرویس متعلق به همان حساب ارائه می‌شود.</div></div>`}
function showReferralRules(){modalTitle.textContent='قوانین دعوت';modal.classList.add('open');detail.innerHTML=`<div class="card"><b>🎁 سیستم دعوت ToonelVPN</b><p class="muted">لینک دعوت اختصاصی شما از همان منطق Referral ربات ساخته می‌شود. خریدهای موفق افراد دعوت‌شده، مطابق تنظیمات فعلی سیستم Referral محاسبه می‌شوند.</p><button class="btn wide" onclick="openBot()">مشاهده جزئیات در ربات</button></div>`}
function shareReferral(){const r=state.data.referral;if(tg?.openTelegramLink){const text=encodeURIComponent('برای دریافت سرویس ToonelVPN از لینک دعوت من استفاده کن:\n'+r.link);tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(r.link)+'&text='+text)}else copyText(r.link,'لینک دعوت کپی شد')}
async function showQR(id){modalTitle.textContent='QR اتصال';modal.classList.add('open');detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال آماده‌سازی…</div>';try{const s=await getService(id);if(!s.subscription_url)throw new Error('Subscription موجود نیست');detail.innerHTML='<div class="qr" id="qrcode"></div><div class="muted" style="text-align:center">QR را با کلاینت VPN سازگار اسکن کنید.</div><button class="btn wide" onclick="copyText('+JSON.stringify(s.subscription_url)+',\'Subscription کپی شد\')">📋 کپی Subscription</button>';if(!window.QRCode){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)})}new QRCode(document.getElementById('qrcode'),{text:s.subscription_url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
function showDashboard(){modalTitle.textContent='داشبورد';modal.classList.add('open');detail.innerHTML=dashboardView()}
async function showAdmin(){modalTitle.textContent='داشبورد مدیریت';modal.classList.add('open');detail.innerHTML='<div class="loading"><div class="spinner"></div>در حال دریافت آمار مدیریت…</div>';try{const x=await api('/miniapp/api/admin/overview');detail.innerHTML=`<div class="admin-banner"><b>🛡️ Admin Dashboard</b><div style="font-size:11px;opacity:.8;margin-top:4px">محافظت‌شده با همان admin_ids پیکربندی‌شده برای Bot.</div></div><div class="grid" style="margin-top:10px"><div class="stat admin-stat"><b>${x.users}</b><span>کاربر</span></div><div class="stat admin-stat"><b>${x.subscriptions}</b><span>اشتراک DB</span></div><div class="stat admin-stat"><b>${x.transactions}</b><span>تراکنش</span></div><div class="stat admin-stat"><b>${x.completed_transactions}</b><span>پرداخت موفق</span></div></div><div class="section"><h2>سرورها</h2></div>${(x.servers||[]).map(s=>`<div class="card" style="margin-bottom:8px"><b>${esc(s.name)}</b><div class="muted">${esc(s.location||'')} • ${s.online?'🟢 آنلاین':'🔴 آفلاین'}</div></div>`).join('')}` }catch(e){detail.innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
load();
</script>
</body></html>
