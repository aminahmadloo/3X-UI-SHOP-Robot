<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>ToonelVPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f4f6f8);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#111827);--hint:var(--tg-theme-hint-color,#6b7280);--button:var(--tg-theme-button-color,#2481cc);--danger:#d9363e;--success:#168a45;--border:rgba(127,127,127,.13)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(36,129,204,.14),transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding:calc(14px + var(--tg-content-safe-area-inset-top,0px)) 14px calc(24px + var(--tg-content-safe-area-inset-bottom,0px))}.wrap{max-width:720px;margin:auto}.hero{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--button),#0f6ba8);color:#fff;font-weight:900;font-size:23px;box-shadow:0 8px 24px rgba(36,129,204,.22)}.title{font-size:21px;font-weight:850;letter-spacing:-.3px}.subtitle{font-size:13px;color:var(--hint);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:15px 10px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.045)}.stat b{display:block;font-size:23px;line-height:1.1;margin-bottom:5px}.stat span{font-size:11px;color:var(--hint)}.section{display:flex;align-items:center;justify-content:space-between;margin:21px 3px 9px}.section-title{font-size:16px;font-weight:850}.section-hint{font-size:11px;color:var(--hint)}.service{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:15px;margin-bottom:9px;box-shadow:0 4px 18px rgba(0,0,0,.045)}.service-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.service-name{font-weight:800;min-width:0;overflow-wrap:anywhere}.badge{white-space:nowrap;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(22,138,69,.12);color:var(--success)}.badge.expired{background:rgba(217,54,62,.12);color:var(--danger)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.meta div{background:rgba(127,127,127,.055);border-radius:11px;padding:8px 9px;font-size:11px;color:var(--hint)}.meta strong{display:block;color:var(--text);font-size:12px;margin-top:3px;overflow-wrap:anywhere}.empty,.error{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:28px 16px;text-align:center}.empty{color:var(--hint)}.error{background:rgba(217,54,62,.08);color:var(--danger)}.error .muted{display:block;margin-top:6px}.loading{text-align:center;padding:44px 16px;color:var(--hint)}.refresh{margin-top:13px;width:100%;border:0;border-radius:13px;padding:11px;background:var(--button);color:var(--tg-theme-button-text-color,#fff);font:inherit;font-weight:700;cursor:pointer}.refresh:active{opacity:.8}@media(max-width:390px){.grid{gap:6px}.stat{padding:13px 7px}.stat b{font-size:20px}.meta{gap:6px}}
  </style>
</head>
<body>
<div class="wrap"><div id="app" class="loading">در حال بارگذاری ToonelVPN…</div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const app=document.getElementById('app'); const initData=tg?.initData||'';
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'}):'—';
const statusText=s=>s==='active'?'فعال':s==='expired'?'منقضی':'غیرفعال';
const safeNumber=v=>Number.isFinite(Number(v))?Number(v):0;
function render(data){
 const u=data.user||{},d=data.dashboard||{},items=Array.isArray(data.services)?data.services:[];
 const first=escapeHtml(u.first_name||'T').slice(0,1)||'T';
 const username=u.username?` · @${escapeHtml(u.username)}`:'';
 const total=safeNumber(d.total_services),active=safeNumber(d.active_services),expired=safeNumber(d.expired_services);
 app.className='';
 app.innerHTML=`<div class="hero"><div class="avatar">${first}</div><div><div class="title">داشبورد ToonelVPN</div><div class="subtitle">${escapeHtml(u.first_name||'کاربر')}${username}</div></div></div>
 <div class="grid"><div class="stat"><b>${total}</b><span>کل سرویس‌ها</span></div><div class="stat"><b>${active}</b><span>سرویس فعال</span></div><div class="stat"><b>${expired}</b><span>منقضی</span></div></div>
 <div class="section"><div class="section-title">📦 سرویس‌های من</div><div class="section-hint">${items.length} سرویس</div></div>
 ${items.length?items.map(s=>{const status=String(s.status||'');const server=s.server||{};return `<article class="service"><div class="service-head"><div class="service-name">${escapeHtml(s.name||`سرویس #${s.id??'—'}`)}</div><span class="badge ${status==='active'?'':'expired'}">${statusText(status)}</span></div><div class="meta"><div>حجم<strong>${safeNumber(s.volume_gb)} گیگابایت</strong></div><div>دستگاه<strong>${safeNumber(s.devices)}</strong></div><div>سرور<strong>${escapeHtml(server.name||'—')}</strong></div><div>انقضا<strong>${fmtDate(s.expire_date)}</strong></div></div></article>`;}).join(''):'<div class="empty">هنوز سرویسی برای این حساب ثبت نشده است.</div>'}
 <button class="refresh" type="button" onclick="load()">↻ بروزرسانی</button>`;
}
async function load(){
 if(!initData){app.className='';app.innerHTML='<div class="error">این صفحه باید از داخل Telegram و از طریق دکمه Mini App باز شود.<span class="muted">لطفاً از منوی ربات دوباره وارد شوید.</span></div>';return;}
 app.className='loading';app.textContent='در حال دریافت اطلاعات…';
 try{const r=await fetch('/miniapp/api/me',{headers:{'X-Telegram-Init-Data':initData},cache:'no-store'});if(r.status===401)throw new Error('auth');if(r.status===403)throw new Error('admin');if(!r.ok)throw new Error('server');render(await r.json());}
 catch(e){app.className='';app.innerHTML=`<div class="error">دسترسی به Mini App امکان‌پذیر نیست.<span class="muted">احراز هویت Telegram یا دسترسی ادمین معتبر نیست.</span><button class="refresh" type="button" onclick="load()">تلاش مجدد</button></div>`;}
}
load();
</script>
</body>
</html>
