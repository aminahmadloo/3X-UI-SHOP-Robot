<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>ToonelVPN</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>
:root{--bg:var(--tg-theme-bg-color,#f5f7fb);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#101828);--hint:var(--tg-theme-hint-color,#667085);--accent:var(--tg-theme-button-color,#1677c8);--border:rgba(16,24,40,.09);--green:#18a558;--orange:#d98200;--red:#d92d20;--shadow:0 8px 28px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px 14px calc(82px + var(--tg-content-safe-area-inset-bottom,0px))}.app{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}.identity{display:flex;gap:11px;align-items:center}.avatar{width:50px;height:50px;border-radius:16px;object-fit:cover;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.name{font-size:19px;font-weight:850}.muted{font-size:12px;color:var(--hint);margin-top:3px}.refresh{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px;font-size:13px}.hero{background:linear-gradient(135deg,var(--accent),#0b4f83);color:#fff;border-radius:22px;padding:19px;box-shadow:var(--shadow);margin-bottom:12px}.hero-label{font-size:12px;opacity:.82}.hero-status{font-size:22px;font-weight:900;margin:5px 0 2px}.hero-meta{font-size:12px;opacity:.9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--hint)}.section{display:flex;justify-content:space-between;align-items:end;margin:20px 3px 9px}.section h2{font-size:17px;margin:0}.section small{color:var(--hint);font-size:11px}.service{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}.service-head{display:flex;justify-content:space-between;gap:10px}.service-name{font-weight:850;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;white-space:nowrap}.active{background:rgba(24,165,88,.12);color:var(--green)}.expired{background:rgba(217,45,32,.12);color:var(--red)}.inactive{background:rgba(102,112,133,.12);color:var(--hint)}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.fact{background:rgba(127,127,127,.06);border-radius:12px;padding:9px}.fact label{display:block;color:var(--hint);font-size:10px;margin-bottom:3px}.fact b{font-size:12px}.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}.btn{border:0;border-radius:12px;padding:10px 8px;font-weight:750;font-size:12px;background:var(--accent);color:#fff}.btn.alt{background:rgba(127,127,127,.09);color:var(--text)}.progress{height:7px;background:rgba(127,127,127,.12);border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}.server-list{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--border);padding:7px 9px;border-radius:999px;font-size:11px}.activity{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}.activity:last-child{border:0}.empty,.error,.loading{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:25px;text-align:center;color:var(--hint)}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 12px calc(8px + var(--tg-content-safe-area-inset-bottom,0px))}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{border:0;background:transparent;color:var(--hint);padding:8px;border-radius:12px;font-size:11px}.nav button.on{background:rgba(22,119,200,.11);color:var(--accent);font-weight:850}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;display:none;align-items:end}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:left;border:0;background:var(--card);border-radius:10px;padding:8px}.url{word-break:break-all;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:12px;font-size:11px;direction:ltr;text-align:left;margin:9px 0}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.facts{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><div id="root" class="loading">در حال بارگذاری Mini App…</div></div><div class="bottom"><div class="nav"><button data-tab="home">🏠<br>خانه</button><button data-tab="services">🔐<br>سرویس‌های من</button><button data-tab="dashboard">📊<br>داشبورد</button></div></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const root=document.getElementById('root'),modal=document.getElementById('modal'),detail=document.getElementById('detail');let state={data:null,tab:'home'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bytes=n=>{n=Number(n);if(n<0)return'نامحدود';if(n>=1073741824)return(n/1073741824).toFixed(1)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return(n/1024).toFixed(1)+' KB';return n+' B'};const date=v=>v?new Date(v).toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'}):'—';const status=s=>s==='active'?['فعال','active']:s==='expired'?['منقضی','expired']:['غیرفعال','inactive'];function serviceCard(s){const[st,cl]=status(s.status),total=Number(s.traffic_total||0),used=Number(s.traffic_used||0),pct=total>0?Math.min(100,Math.round(used/total*100)):0;return `<div class="service"><div class="service-head"><div class="service-name">${esc(s.name)}</div><span class="badge ${cl}">${st}</span></div><div class="facts"><div class="fact"><label>مصرف</label><b>${bytes(used)}</b></div><div class="fact"><label>باقی‌مانده</label><b>${bytes(s.traffic_remaining)}</b></div><div class="fact"><label>انقضا</label><b>${date(s.expire_date)}</b></div><div class="fact"><label>دستگاه</label><b>${s.devices<0?'نامحدود':s.devices}</b></div></div>${total>0?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}<div class="muted">${esc(s.server?.name||'سرور نامشخص')} ${s.online?'• آنلاین':''}</div><div class="actions"><button class="btn" onclick="openDetail(${s.id})">جزئیات</button><button class="btn alt" onclick="copySubscription(${s.id})">Subscription</button><button class="btn alt" onclick="openBot()">تمدید</button></div></div>`}function header(){const u=state.data.user,t=state.data.telegram,photo=t?.photo_url?`<img class="avatar" src="${esc(t.photo_url)}">`:`<div class="avatar">${esc((u.first_name||'ت')[0])}</div>`;return `<div class="top"><div class="identity">${photo}<div><div class="name">سلام ${esc(u.first_name)} 👋</div><div class="muted">حساب ToonelVPN</div></div></div><button class="refresh" onclick="load()">↻</button></div>`}function home(){const d=state.data.dashboard,s=state.data.services[0];return `${header()}<div class="hero"><div class="hero-label">وضعیت کلی حساب</div><div class="hero-status">${d.active_services?'🟢 سرویس فعال':'⚪ بدون سرویس فعال'}</div><div class="hero-meta">${d.active_services} فعال • ${d.total_services} سرویس زنده در 3X-UI</div></div><div class="grid"><div class="stat"><b>${d.active_services}</b><span>سرویس فعال</span></div><div class="stat"><b>${bytes(d.traffic_used)}</b><span>مصرف‌شده</span></div><div class="stat"><b>${bytes(d.traffic_remaining)}</b><span>باقی‌مانده</span></div><div class="stat"><b>${s?date(s.expire_date):'—'}</b><span>نزدیک‌ترین انقضا</span></div></div><div class="section"><h2>میانبرهای سریع</h2></div><div class="grid"><button class="btn" onclick="setTab('services')">🔐 سرویس‌های من</button><button class="btn alt" onclick="openBot()">🛒 خرید سرویس</button></div>${s?`<div class="section"><h2>سرویس اصلی</h2></div>${serviceCard(s)}`:''}`}function servicesTab(){return `${header()}<div class="section"><h2>My Services</h2><small>${state.data.services.length} سرویس زنده از 3X-UI</small></div>${state.data.services.length?state.data.services.map(serviceCard).join(''):'<div class="empty">سرویسی برای این حساب در 3X-UI پیدا نشد.</div>'}`}function dashboard(){const d=state.data.dashboard;return `${header()}<div class="section"><h2>Dashboard</h2><small>داده‌های زنده</small></div><div class="grid"><div class="stat"><b>${d.active_services}</b><span>فعال</span></div><div class="stat"><b>${d.expired_services}</b><span>منقضی</span></div><div class="stat"><b>${d.total_services}</b><span>سرویس زنده</span></div><div class="stat"><b>${date(d.nearest_expiry)}</b><span>نزدیک‌ترین انقضا</span></div></div><div class="section"><h2>سرورهای مورد استفاده</h2></div><div class="server-list">${d.servers.map(x=>`<span class="chip">🖥️ ${esc(x.name)}${x.location?' • '+esc(x.location):''}</span>`).join('')||'<span class="muted">—</span>'}</div><div class="section"><h2>فعالیت‌های اخیر</h2></div><div class="service">${d.recent_activity.map(x=>`<div class="activity"><span>•</span><div><b>${esc(x.title)}</b><div class="muted">${date(x.date)} • ${esc(x.status)}</div></div></div>`).join('')||'<div class="muted">فعالیتی ثبت نشده است.</div>'}</div>`}function render(){root.innerHTML=state.tab==='home'?home():state.tab==='services'?servicesTab():dashboard();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab))}function setTab(t){state.tab=t;render()}async function load(){try{if(!tg?.initData)throw new Error('این Mini App باید از داخل تلگرام باز شود.');root.innerHTML='<div class="loading">در حال دریافت اطلاعات زنده از 3X-UI…</div>';const r=await fetch('/miniapp/api/me',{headers:{'X-Telegram-Init-Data':tg.initData},cache:'no-store'});if(!r.ok)throw new Error(await r.text());state.data=await r.json();render()}catch(e){root.innerHTML=`<div class="error">❌ ${esc(e.message||'خطا در دریافت اطلاعات')}<br><br><button class="btn" onclick="load()">تلاش دوباره</button></div>`}}async function openDetail(id){try{detail.innerHTML='<div class="loading">در حال دریافت جزئیات…</div>';modal.classList.add('open');const r=await fetch('/miniapp/api/services/'+id,{headers:{'X-Telegram-Init-Data':tg.initData},cache:'no-store'});if(!r.ok)throw new Error(await r.text());const s=await r.json();detail.innerHTML=`<div class="section"><h2>${esc(s.name)}</h2><span class="badge ${status(s.status)[1]}">${status(s.status)[0]}</span></div><div class="facts"><div class="fact"><label>مصرف</label><b>${bytes(s.traffic_used)}</b></div><div class="fact"><label>باقی‌مانده</label><b>${bytes(s.traffic_remaining)}</b></div><div class="fact"><label>کل حجم</label><b>${bytes(s.traffic_total)}</b></div><div class="fact"><label>دستگاه</label><b>${s.devices<0?'نامحدود':s.devices}</b></div><div class="fact"><label>انقضا</label><b>${date(s.expire_date)}</b></div><div class="fact"><label>سرور</label><b>${esc(s.server?.name||'—')}</b></div><div class="fact"><label>اتصال</label><b>${s.online?'🟢 آنلاین':'⚪ آفلاین/نامشخص'}</b></div><div class="fact"><label>Inbound</label><b>${esc(s.inbound_id||'—')}</b></div></div><button class="btn" style="width:100%" onclick="copySubscription(${s.id})">📋 دریافت Subscription</button><div class="url">${s.subscription_url?esc(s.subscription_url):'لینک اشتراک در دسترس نیست'}</div>`}catch(e){detail.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}async function copySubscription(id){try{const r=await fetch('/miniapp/api/services/'+id,{headers:{'X-Telegram-Init-Data':tg.initData},cache:'no-store'});if(!r.ok)throw new Error('سرویس پیدا نشد');const s=await r.json();if(!s.subscription_url)throw new Error('لینک اشتراک موجود نیست');await navigator.clipboard.writeText(s.subscription_url);tg?.showPopup?.({title:'ToonelVPN',message:'لینک Subscription کپی شد.',buttons:[{type:'ok'}]})}catch(e){alert(e.message)}}function closeModal(){modal.classList.remove('open')}function openBot(){if(tg?.openTelegramLink)tg.openTelegramLink('https://t.me/ToonelVpn_bot');else location.href='https://t.me/ToonelVpn_bot'}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));load();
</script></body></html>
